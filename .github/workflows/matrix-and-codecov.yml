name: Matrix and Codecov

on:
  push:
    branches:
      - main

  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  matrix-coverage:
    name: C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
        include:
          - os: ubuntu-latest
            shell: bash -l {0}
            build-type: Debug
            coverage: "ON"
            jobs: 4
          - os: windows-latest
            shell: cmd /C CALL {0}
            jobs: 4
          - os: macos-latest
            shell: bash -l {0}
            build-type: Release
            coverage: "OFF"
            jobs: 2
          - os: macos-15-intel
            shell: bash -l {0}
            build-type: Release
            coverage: "OFF"
            jobs: 4
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Check out libdiffpy
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up C++ tests
        uses: ./.github/actions/setup-tests

      - name: Build and run C++ tests
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build/ci -G Ninja $CMAKE_ARGS \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DLIBDIFFPY_COVERAGE=${{ matrix.coverage }} \
            -DLIBDIFFPY_BUILD_TESTS=ON
          cmake --build build/ci --parallel ${{ matrix.jobs }}
          ctest --test-dir build/ci --output-on-failure

      # The conda cxx-compiler activation configures MSVC for Ninja in cmd.
      - name: Build and run C++ tests (Windows)
        if: runner.os == 'Windows'
        run: |
          where cl.exe || exit /b 1
          cmake --preset release -DLIBDIFFPY_BUILD_TESTS=ON || exit /b 1
          cmake --build --preset release --parallel ${{ matrix.jobs }} || exit /b 1
          ctest --test-dir build\release --output-on-failure --no-tests=error

      - name: Check SIMD kernel isolation
        run: python .github/scripts/check-kernel-isolation.py build

      - name: Save SIMD kernel objects
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-objects-${{ matrix.os }}
          path: |
            build/**/CalculationKernel*.o
            build/**/CalculationKernel*.obj
          if-no-files-found: ignore

      - name: Generate coverage report
        if: matrix.coverage == 'ON'
        run: >-
          gcovr --gcov-executable "$CONDA_PREFIX/bin/gcov"
          --root . --filter 'src/diffpy/'
          --xml coverage.xml

      - name: Save coverage report
        if: matrix.coverage == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        # Fork push builds have no upstream Codecov token; keep their artifact.
        if: matrix.coverage == 'ON' && github.repository == 'diffpy/libdiffpy'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
